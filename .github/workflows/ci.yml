name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Integration tests are skipped unless this is set. CI never sets it, so the
  # suite must pass with no network access to any model endpoint.
  NATLAS_BASE_URL: ""

jobs:
  # ---------------------------------------------------------------------------
  # JavaScript / TypeScript: format, lint, typecheck, test, build
  # ---------------------------------------------------------------------------
  js:
    name: JS SDK (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 18 is EOL (ended 2025-04-30). Transcription uses the global
        # File constructor, which Node only provides from 20 onward. On Node 18
        # the suite dies with `ReferenceError: File is not defined` while
        # reading the multipart body. engines is `>=20` for the same reason.
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Build playground
        run: pnpm --filter @n-atlas/playground build

      - name: Verify the built package is importable as ESM and CJS
        working-directory: packages/js-sdk
        run: |
          node --input-type=module -e "
            import { LLM_MODEL_ID, ASR_MODEL_IDS } from './dist/index.js';
            if (LLM_MODEL_ID !== 'NCAIR1/N-ATLaS') throw new Error('bad ESM export');
            if (ASR_MODEL_IDS.ha !== 'NCAIR1/Hausa-ASR') throw new Error('bad ESM export');
            console.log('ESM ok');
          "
          node --input-type=commonjs -e "
            const { LLM_MODEL_ID } = require('./dist/index.cjs');
            if (LLM_MODEL_ID !== 'NCAIR1/N-ATLaS') throw new Error('bad CJS export');
            console.log('CJS ok');
          "

  # ---------------------------------------------------------------------------
  # Python: ruff, mypy, pytest
  # ---------------------------------------------------------------------------
  python:
    name: Python SDK (${{ matrix.python }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python-sdk
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: packages/python-sdk/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check --output-format=github .

      - name: Check formatting (ruff format)
        run: ruff format --check .

      - name: Type-check (mypy)
        run: mypy src

      - name: Test
        run: pytest --cov --cov-report=term-missing

      - name: Build the distribution
        run: |
          python -m pip install build
          python -m build

      - name: Verify the built wheel imports cleanly
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install --quiet dist/*.whl
          /tmp/verify/bin/python -c "
          import natlas
          assert natlas.LLM_MODEL_ID == 'NCAIR1/N-ATLaS', natlas.LLM_MODEL_ID
          assert natlas.ASR_MODEL_IDS['ha'] == 'NCAIR1/Hausa-ASR'
          print('wheel ok', natlas.__version__)
          "

  # ---------------------------------------------------------------------------
  # /serve - the self-hosting kit. Everything here runs without a GPU and
  # without downloading any gated weights; see serve/README.md for the list of
  # things that consequently are NOT covered.
  # ---------------------------------------------------------------------------
  serve:
    name: Serve (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor declared in serve/pyproject.toml. Testing it
        # catches 3.11+-only APIs (datetime.UTC, tomllib, ...) that would
        # otherwise only fail for users.
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: serve/pyproject.toml

      - name: Install ffmpeg
        # The ubuntu-24.04 runner image does NOT ship ffmpeg, and the whole
        # audio path shells out to it. Install a real one so the tests exercise
        # the same code path as the Docker image rather than only the
        # imageio-ffmpeg fallback that conftest.py provides for developers.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # [dev] only - [asr] would pull ~2.5 GB of torch for no benefit here.
          python -m pip install -e "serve[dev]" "modal>=1.0"

      - name: Report which ffmpeg the code resolves
        # Deliberately not `ffmpeg -version | head -1`: a pipeline reports the
        # exit status of its *last* command, so that form passes even when
        # ffmpeg is missing. Ask the resolver we actually use instead.
        run: |
          python -c "
          from natlas_serve.audio import ffmpeg_binary
          import subprocess
          exe = ffmpeg_binary()
          print('resolved:', exe)
          print(subprocess.run([exe, '-version'], capture_output=True, text=True).stdout.splitlines()[0])
          "

      - name: Lint (ruff)
        run: ruff check --output-format=github serve/

      - name: Check formatting (ruff format)
        run: ruff format --check serve/

      - name: Type-check (mypy, strict)
        working-directory: serve
        run: mypy natlas_serve

      - name: Test
        working-directory: serve
        run: pytest --cov --cov-report=term-missing

      - name: Modal apps are importable
        run: |
          for f in serve/modal_*.py; do
            echo "--- $f"
            python -c "
          import importlib.util
          spec = importlib.util.spec_from_file_location('m', '$f')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          print('imported ok:', mod.app.name)
          "
          done

      - name: docker compose config is valid
        if: matrix.python == '3.12'
        working-directory: serve
        # Resolves interpolation, merges the YAML anchors and validates the
        # schema. Does not build or pull anything.
        env:
          HF_TOKEN: hf_dummy_for_validation
          NATLAS_API_KEYS: dummy_for_validation
        run: docker compose config --quiet && echo ok

      - name: The gateway refuses to start without API keys
        # The single most important misconfiguration to catch: a GPU endpoint
        # listening to the internet with no authentication.
        run: |
          python -c "
          from natlas_serve.config import ConfigError, Settings
          try:
              Settings.from_env({})
          except ConfigError as exc:
              assert 'refuses to start wide open' in str(exc), exc
              print('ok - refused:', str(exc).splitlines()[0])
          else:
              raise SystemExit('FAIL: the gateway started with no API keys')
          "

  # ---------------------------------------------------------------------------
  # Docs site. VitePress, static output, no secrets.
  # ---------------------------------------------------------------------------
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the docs site
        run: pnpm --filter @n-atlas/docs build

  # ---------------------------------------------------------------------------
  # Example apps. JS tests also run inside the JS SDK job via pnpm -r.
  # The Python example is not part of that workspace script.
  # ---------------------------------------------------------------------------
  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Voice-note translator tests
        run: pnpm --filter @n-atlas/example-voice-note test

      - name: Install the Python SDK and test the support-reply example
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e packages/python-sdk
          python -m unittest examples/support-reply/test_reply.py

  # ---------------------------------------------------------------------------
  # Repo hygiene: no secrets, no model weights, no wrapped foreign LLMs
  # ---------------------------------------------------------------------------
  guardrails:
    name: Guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No committed .env files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "::error::A .env file is tracked by git. Secrets must stay in the environment."
            exit 1
          fi
          echo "ok"

      - name: No model weights committed
        run: |
          if git ls-files | grep -Ei '\.(safetensors|gguf|onnx|pt|pth)$|(^|/)pytorch_model\.bin$'; then
            echo "::error::Model weights are tracked by git. They are gated, huge, and not Apache-2.0."
            exit 1
          fi
          echo "ok"

      - name: No other LLM vendor SDKs in any manifest
        run: |
          # Hard rule: N-ATLAS Kit must never wrap GPT, Claude, Gemini or similar.
          hits=$(git ls-files '*package.json' '*pyproject.toml' 'requirements*.txt' \
            | xargs grep -nEi '"(openai|@anthropic-ai/sdk|@google/generative-ai|@mistralai/[a-z-]+|cohere-ai|groq-sdk)"|^[[:space:]]*"?(openai|anthropic|google-generativeai|mistralai|cohere|groq)[<>=~!\[" ]' \
            || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::A foreign LLM SDK is declared as a dependency. N-ATLAS Kit must only call N-ATLaS."
            exit 1
          fi
          echo "ok"

      - name: Every NCAIR model reference is a real repo id
        run: |
          # Catches typos like NCAIR-NG/Hausa (which appears in the upstream
          # model card) or N-ATLAS instead of N-ATLaS in code.
          bad=$(git ls-files 'packages/**' 'serve/**' 'apps/**' 'examples/**' \
            | xargs grep -nE 'NCAIR[^1]|NCAIR1/[A-Za-z0-9._-]+' 2>/dev/null \
            | grep -oE 'NCAIR[A-Za-z0-9-]*/[A-Za-z0-9._-]+' \
            | sort -u \
            | grep -vE '^NCAIR1/(N-ATLaS|Hausa-ASR|Igbo-ASR|Yoruba-ASR|NigerianAccentedEnglish)$' \
            || true)
          if [ -n "$bad" ]; then
            echo "$bad"
            echo "::error::Unknown NCAIR model id referenced. The five real ids are listed in the README."
            exit 1
          fi
          echo "ok"
