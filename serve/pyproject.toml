[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "natlas-serve"
version = "0.1.0"
description = "Self-hosting kit for N-ATLaS: the LLM and all four ASR models behind one OpenAI-compatible base URL."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "OneDev Studioo" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
]

[project.optional-dependencies]
# The ASR service. Heavy: pulls torch. Not needed by the gateway.
asr = ["torch>=2.2", "transformers>=4.44", "accelerate>=0.33"]

dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    # Static ffmpeg so the audio tests run on a machine without one.
    "imageio-ffmpeg>=0.5",
    # Reads docker-compose.yml in tests/test_deployment.py.
    "pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["natlas_serve"]

# NOTE: deliberately no [tool.ruff] here. The repo-root ruff.toml governs
# serve/, so lint rules stay consistent across every non-SDK Python file.

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
asyncio_mode = "auto"
markers = [
    "gpu: needs a real GPU and the gated NCAIR1 weights; never runs in CI",
]

[tool.mypy]
# No `python_version` pin on purpose. Pinning it to our 3.10 floor makes
# mypy parse the *installed* numpy stubs as 3.10 source, and numpy >= 2.5
# writes them with PEP 695 `type` statements, which is a hard parse error.
# Letting mypy follow the interpreter means the CI matrix checks 3.10 with a
# real 3.10 and 3.12 with a real 3.12, which is stricter anyway.
files = ["natlas_serve"]
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["transformers.*", "torch.*", "imageio_ffmpeg.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["natlas_serve"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
