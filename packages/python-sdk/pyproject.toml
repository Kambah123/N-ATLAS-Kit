[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "natlas"
version = "0.0.0"
description = "Python SDK for N-ATLaS, Nigeria's sovereign multilingual LLM (Hausa, Igbo, Yoruba, Nigerian English) and its ASR models."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "OneDev Studioo" }]
keywords = [
    "n-atlas",
    "natlas",
    "nigeria",
    "hausa",
    "igbo",
    "yoruba",
    "llm",
    "asr",
    "speech-to-text",
    "african-languages",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "typing-extensions>=4.10; python_version < '3.11'",
]

[project.optional-dependencies]
# `pip install natlas[cli]` -> the `natlas` command
cli = ["typer>=0.12", "rich>=13.7"]

# `pip install natlas[local]` -> run NCAIR1/N-ATLaS and the ASR models directly.
# Heavy: pulls torch. Requires a GPU for anything but toy use, and an HF_TOKEN
# because every NCAIR1 repo is gated.
local = [
    "torch>=2.2",
    "transformers>=4.44",
    "accelerate>=0.33",
    "huggingface-hub>=0.24",
    "librosa>=0.10",
    "soundfile>=0.12",
]

dev = [
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/Kambah123/N-ATLAS-Kit"
Documentation = "https://github.com/Kambah123/N-ATLAS-Kit/tree/main/docs"
Repository = "https://github.com/Kambah123/N-ATLAS-Kit"
Issues = "https://github.com/Kambah123/N-ATLAS-Kit/issues"
Changelog = "https://github.com/Kambah123/N-ATLAS-Kit/blob/main/CHANGELOG.md"

# The CLI is wired up in the next milestone.
# [project.scripts]
# natlas = "natlas.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/natlas"]

[tool.hatch.build.targets.sdist]
include = ["src/natlas", "tests", "README.md", "pyproject.toml"]


# ---------------------------------------------------------------------------
# ruff - lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific
    "ANN",  # flake8-annotations
    "ASYNC",
    "S",    # bandit
    "T20",  # flake8-print
]
ignore = [
    "ANN401", # allow `Any` where it is genuinely the right type
    "S101",   # assert is fine (pytest)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S", "T20", "A004"]
# TimeoutError matches the JS SDK. It intentionally shadows the builtin.
"src/natlas/errors.py" = ["A001"]
"src/natlas/__init__.py" = ["A004"]
"src/natlas/wire.py" = ["A004"]
"src/natlas/transport.py" = ["A004"]

[tool.ruff.lint.isort]
known-first-party = ["natlas"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


# ---------------------------------------------------------------------------
# mypy - strict
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["transformers.*", "librosa.*", "soundfile.*", "torch.*"]
ignore_missing_imports = true


# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
asyncio_mode = "auto"
markers = [
    "integration: hits a real N-ATLaS endpoint; skipped unless NATLAS_BASE_URL is set",
]

[tool.coverage.run]
source = ["src/natlas"]
branch = true

[tool.coverage.report]
# Raised to 70 in PROMPT 8 once there is real code to cover.
fail_under = 0
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
